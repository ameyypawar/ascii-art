<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Millennium Falcon — Hyperspace Jump</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #d8d8d8;
      height: 100%;
      font-family: "Menlo", "Monaco", "Consolas", "Courier New", monospace;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      min-height: 100vh;
    }
    #screen {
      font-size: 18px;
      line-height: 1.05;
      letter-spacing: 0;
      white-space: pre;
      margin: 0;
      padding: 24px 28px;
      border: 1px solid #222;
      border-radius: 6px;
      background: #050505;
      color: #f5f5f5;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.15);
    }
    #screen.flash {
      color: #fff;
      text-shadow: 0 0 10px #fff, 0 0 24px #88c0ff;
    }
    .controls {
      margin-top: 18px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #111;
      color: #ffd24a;
      border: 1px solid #ffd24a;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.05em;
      cursor: pointer;
      border-radius: 3px;
    }
    button:hover { background: #1a1a1a; }
    .caption {
      margin-top: 12px;
      color: #666;
      font-size: 12px;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <pre id="screen"></pre>
  <div class="controls">
    <button id="replay">REPLAY</button>
  </div>
  <div class="caption">millennium falcon · hyperspace jump · 67×13</div>

  <script>
    const W = 67;
    const H = 13;

    // 13 lines of starfield. Each line is W chars (we trim/pad below).
    const STAR_ROWS = [
      "  *    .         *         .       *       .         *      .     ",
      ".         *          .             *          .       *         * ",
      "     .         *          .       *        *       .       .      ",
      ".    *      .       *        .          *      .         *       .",
      "   *           .             *      .       *       .      *      ",
      ".      *      .         *         .        *      .         *     ",
      "     *      .       *          .       *       .       *      .   ",
      ".        *         .       *           .       *        .        *",
      "   *        .         *           .         *        .         *  ",
      "      *        .        *        .       *          .        *    ",
      ".         *       .         *         .         *         .       ",
      "    *         .         *        .          *         .       *   ",
      ".       *         .       *          .       *          .         ",
    ].map(r => (r + " ".repeat(W)).slice(0, W));

    // Falcon side-view sprite (4 rows, 18 cols). Spaces are transparent.
    const FALCON = [
      "       _____      ",
      "    __/_____\\__   ",
      "   /___________\\  ",
      "       \\___/      ",
    ];

    function emptyStarfield() {
      return STAR_ROWS.map(r => r.split(""));
    }

    function overlaySprite(grid, sprite, x0, y0) {
      for (let i = 0; i < sprite.length; i++) {
        const row = sprite[i];
        for (let j = 0; j < row.length; j++) {
          const ch = row[j];
          if (ch === " ") continue;
          const r = y0 + i;
          const c = x0 + j;
          if (r >= 0 && r < H && c >= 0 && c < W) grid[r][c] = ch;
        }
      }
    }

    function overlayText(grid, text, x0, y0) {
      for (let j = 0; j < text.length; j++) {
        const c = x0 + j;
        if (c >= 0 && c < W) grid[y0][c] = text[j];
      }
    }

    function drawEngineTrail(grid, falconX, falconY, length, ch) {
      // engines sit behind the falcon (trailing to the right since it's flying left)
      const trailRow = falconY + 2; // middle of falcon
      const start = falconX + FALCON[0].length;
      for (let i = 0; i < length; i++) {
        const c = start + i;
        if (c >= 0 && c < W) grid[trailRow][c] = ch;
      }
    }

    function hyperspaceStreaks(level) {
      // level 1 -> short streaks "--", level 2 -> longer "-----", level 3 -> full lines
      const grid = [];
      const lengths = [0, 3, 6, 14];
      const L = lengths[level] || 0;
      for (let r = 0; r < H; r++) {
        const row = new Array(W).fill(" ");
        // pick a starting col based on row parity for variety
        const offset = (r * 7 + level * 3) % 11;
        for (let c = 0; c < W; c++) {
          if ((c + offset) % 13 === 0) {
            for (let k = 0; k < L && c + k < W; k++) row[c + k] = "-";
          }
        }
        grid.push(row);
      }
      return grid;
    }

    function flashFrame() {
      const grid = [];
      for (let r = 0; r < H; r++) {
        const row = new Array(W).fill(" ");
        for (let c = 0; c < W; c++) {
          row[c] = "-";
        }
        grid.push(row);
      }
      return grid;
    }

    function gridToString(grid) {
      return grid.map(r => r.join("")).join("\n");
    }

    // Build the animation as a list of [delayMs, contentString, flash?] entries.
    function buildFrames() {
      const frames = [];

      // 1. Title card #1
      {
        const g = emptyStarfield();
        overlayText(g, "A long time ago in a galaxy", 19, 5);
        overlayText(g, "far, far away....",          24, 7);
        frames.push([2200, gridToString(g)]);
      }

      // 2. Empty starfield (breath before action)
      frames.push([1200, gridToString(emptyStarfield())]);

      // 3-9. Falcon flies right-to-left
      const positions = [52, 45, 38, 31, 24, 17, 12];
      for (const x of positions) {
        const g = emptyStarfield();
        overlaySprite(g, FALCON, x, 4);
        frames.push([550, gridToString(g)]);
      }

      // 10. Centered pause
      {
        const g = emptyStarfield();
        overlaySprite(g, FALCON, 12, 4);
        frames.push([900, gridToString(g)]);
      }

      // 11-12. Engines spool up
      {
        const g = emptyStarfield();
        overlaySprite(g, FALCON, 12, 4);
        drawEngineTrail(g, 12, 4, 4, "=");
        frames.push([500, gridToString(g)]);
      }
      {
        const g = emptyStarfield();
        overlaySprite(g, FALCON, 12, 4);
        drawEngineTrail(g, 12, 4, 10, "=");
        frames.push([450, gridToString(g)]);
      }
      {
        const g = emptyStarfield();
        overlaySprite(g, FALCON, 12, 4);
        drawEngineTrail(g, 12, 4, 18, ">");
        frames.push([400, gridToString(g)]);
      }

      // 13-15. Hyperspace streaks (falcon still visible, streaks growing)
      {
        const g = hyperspaceStreaks(1);
        overlaySprite(g, FALCON, 12, 4);
        frames.push([350, gridToString(g)]);
      }
      {
        const g = hyperspaceStreaks(2);
        overlaySprite(g, FALCON, 12, 4);
        frames.push([300, gridToString(g)]);
      }
      {
        const g = hyperspaceStreaks(3);
        overlaySprite(g, FALCON, 12, 4);
        frames.push([280, gridToString(g)]);
      }

      // 16. Flash — falcon gone
      frames.push([180, gridToString(flashFrame()), true]);

      // 17. Settle to empty starfield
      frames.push([1200, gridToString(emptyStarfield())]);

      // 18. Closing line
      {
        const g = emptyStarfield();
        overlayText(g, "The Force is with you.", 22, 6);
        frames.push([2500, gridToString(g)]);
      }

      return frames;
    }

    const FRAMES = buildFrames();
    const screen = document.getElementById("screen");

    let playing = false;
    async function play() {
      if (playing) return;
      playing = true;
      for (const [delay, content, flash] of FRAMES) {
        screen.textContent = content;
        screen.classList.toggle("flash", !!flash);
        await new Promise(r => setTimeout(r, delay));
      }
      screen.classList.remove("flash");
      playing = false;
    }

    document.getElementById("replay").addEventListener("click", play);
    play();
  </script>
</body>
</html>
